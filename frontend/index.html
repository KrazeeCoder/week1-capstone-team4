<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Song Finder</h1>
  <p>Play or upload a song and find out what it is.</p>

  <hr>

  <h2>Identify a song</h2>
  <p>Record from your microphone, or upload a .wav clip.</p>
  <button id="scan-btn"><span id="scan-text">Start recording</span></button>
  <p>Or upload a clip: <input type="file" id="clip-file" accept=".wav,audio/wav"></p>
  <p id="match-result"></p>

  <hr>

  <h2>Library</h2>
  <ul id="songs-list"></ul>

  <hr>

  <h2>Add a song</h2>
  <form id="add-form">
    <p>Title: <input type="text" id="song-title"></p>
    <p>Artist: <input type="text" id="song-artist"></p>
    <p>Audio file (.wav): <input type="file" id="song-file" accept=".wav,audio/wav"></p>
    <button type="submit" id="add-button">Add song</button>
  </form>
  <p id="add-result"></p>

  <hr>

  <p>BWSI Week 1 capstone - Team 4</p>

  <script src="script.js"></script>
</body>
</html>
